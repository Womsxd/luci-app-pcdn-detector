<%#
 luci-app-pcdn-detector 概览页：运行状态、服务控制、HTTP API 实时统计
-%>

<style>
	/* 配色说明：容器底色 / 边框 / 次要文字统一用半透明中性色（rgba(128,128,128,x)）
	   与 opacity，避免暗色主题下写死的浅色底压住主题的浅色文字；
	   语义色（红 / 橙 / 绿）用半透明底色，文字色与主题正文色 color-mix 后自适应明暗。 */
	.pcdn-status {
		display: flex;
		flex-wrap: wrap;
		gap: 10px;
		margin: 0 0 12px 0;
	}
	.pcdn-item {
		flex: 1 1 150px;
		min-width: 140px;
		padding: 8px 10px;
		border: 1px solid rgba(128, 128, 128, 0.35);
		border-radius: 4px;
		background: rgba(128, 128, 128, 0.07);
	}
	.pcdn-label {
		display: block;
		font-size: 12px;
		opacity: 0.7;
		margin-bottom: 4px;
	}
	.pcdn-value {
		display: block;
		font-size: 14px;
		font-weight: bold;
		word-break: break-all;
	}
	/* 语义文字色与当前正文色混合：亮色主题下接近原色，暗色主题下自动提亮；
	   不支持 color-mix 的浏览器沿用前一条固定色 */
	.pcdn-ok { color: #2e7d32; color: color-mix(in srgb, #2e7d32 65%, currentColor); }
	.pcdn-bad { color: #c62828; color: color-mix(in srgb, #c62828 65%, currentColor); }
	.pcdn-muted { opacity: 0.7; font-weight: normal; }
	.pcdn-actions { margin: 10px 0; }
	.pcdn-actions .cbi-button { margin-right: 6px; margin-bottom: 4px; }
	.pcdn-msg {
		margin: 8px 0 0 0;
		padding: 6px 8px;
		border-radius: 3px;
		display: none;
		white-space: pre-wrap;
	}
	.pcdn-msg-ok {
		display: block;
		background: rgba(76, 175, 80, 0.15);
		border: 1px solid rgba(76, 175, 80, 0.5);
		color: #2e7d32;
		color: color-mix(in srgb, #2e7d32 65%, currentColor);
	}
	.pcdn-msg-bad {
		display: block;
		background: rgba(244, 67, 54, 0.15);
		border: 1px solid rgba(244, 67, 54, 0.5);
		color: #c62828;
		color: color-mix(in srgb, #c62828 65%, currentColor);
	}
	.pcdn-stats-cards {
		display: flex;
		flex-wrap: wrap;
		gap: 10px;
		margin-bottom: 10px;
	}
	.pcdn-stat {
		flex: 1 1 110px;
		padding: 8px 10px;
		border: 1px solid rgba(128, 128, 128, 0.25);
		border-radius: 4px;
		text-align: center;
	}
	.pcdn-stat b { display: block; font-size: 20px; line-height: 1.4; }
	.pcdn-stat span { font-size: 12px; opacity: 0.7; }
	.pcdn-table { width: 100%; border-collapse: collapse; background: transparent; }
	.pcdn-table th, .pcdn-table td {
		padding: 4px 6px;
		border-bottom: 1px solid rgba(128, 128, 128, 0.22);
		text-align: left;
		font-size: 13px;
		/* 显式继承，避免主题给表格写死深色文字后，在暗色弹窗里变成深字压深底 */
		color: inherit;
		background: transparent;
	}
	.pcdn-table th { background: rgba(128, 128, 128, 0.14); }
	/* 告警行用半透明橙：亮色下接近原来的浅橙，暗色下是暗橙，不刺眼也不会压掉文字 */
	.pcdn-table tr.pcdn-alert td { background: rgba(255, 152, 0, 0.16); }
	.pcdn-empty { opacity: 0.6; text-align: center !important; }
	.pcdn-detail {
		margin-top: 12px;
		padding: 10px;
		border: 1px solid rgba(128, 128, 128, 0.3);
		border-radius: 4px;
		background: rgba(128, 128, 128, 0.06);
		color: inherit;
	}
	.pcdn-detail-head {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		align-items: center;
		margin-bottom: 8px;
	}
	.pcdn-detail-head h4 { margin: 0; font-size: 14px; }
	.pcdn-detail-filters {
		display: flex;
		flex-wrap: wrap;
		gap: 12px;
		align-items: center;
		margin-bottom: 8px;
		font-size: 13px;
	}
	.pcdn-detail-filters select { font-size: 13px; padding: 1px 4px; }
	.pcdn-badge {
		display: inline-block;
		padding: 0 6px;
		border: 1px solid transparent;
		border-radius: 9px;
		font-size: 11px;
		line-height: 16px;
		/* 徽章文字基于主题正文色混合，亮 / 暗主题下都有足够对比度 */
		color: inherit;
		white-space: nowrap;
	}
	.pcdn-badge-ban {
		background: rgba(198, 40, 40, 0.18);
		border-color: rgba(198, 40, 40, 0.55);
		color: #c62828;
		color: color-mix(in srgb, #c62828 65%, currentColor);
	}
	.pcdn-badge-alert {
		background: rgba(230, 81, 0, 0.2);
		border-color: rgba(230, 81, 0, 0.6);
		color: #e65100;
		color: color-mix(in srgb, #e65100 65%, currentColor);
	}
	.pcdn-badge-ok {
		background: rgba(46, 125, 50, 0.18);
		border-color: rgba(46, 125, 50, 0.55);
		color: #2e7d32;
		color: color-mix(in srgb, #2e7d32 65%, currentColor);
	}
	.pcdn-pager {
		display: flex;
		flex-wrap: wrap;
		gap: 8px;
		align-items: center;
		margin-top: 8px;
		font-size: 13px;
	}
	.pcdn-rowbtn { padding: 1px 6px; font-size: 12px; line-height: 20px; }
	.pcdn-auto {
		display: inline-block;
		font-size: 13px;
		margin: 0 8px 4px 2px;
		white-space: nowrap;
		vertical-align: middle;
	}
	.pcdn-auto input { vertical-align: -2px; margin-right: 3px; }
	.pcdn-peers {
		margin-top: 10px;
		padding: 8px 10px;
		border: 1px dashed rgba(128, 128, 128, 0.35);
		border-radius: 4px;
		background: rgba(128, 128, 128, 0.06);
		color: inherit;
	}
	.pcdn-peers-list {
		font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
		font-size: 12px;
		line-height: 1.6;
		word-break: break-all;
	}
</style>

<fieldset class="cbi-section">
	<legend>运行状态</legend>

	<div class="pcdn-status">
		<div class="pcdn-item">
			<span class="pcdn-label">服务状态</span>
			<span id="pcdn-run" class="pcdn-value pcdn-muted">读取中…</span>
		</div>
		<div class="pcdn-item">
			<span class="pcdn-label">版本</span>
			<span id="pcdn-version" class="pcdn-value">—</span>
			<span id="pcdn-version-build" class="pcdn-value pcdn-muted" style="font-size:12px;"></span>
		</div>
		<div class="pcdn-item">
			<span class="pcdn-label">PID / 运行时长</span>
			<span id="pcdn-pid" class="pcdn-value">—</span>
			<span id="pcdn-uptime" class="pcdn-value pcdn-muted" style="font-size:12px;">—</span>
		</div>
		<div class="pcdn-item">
			<span class="pcdn-label">监听网卡 / 协议</span>
			<span id="pcdn-iface" class="pcdn-value">—</span>
			<span id="pcdn-proto" class="pcdn-value pcdn-muted" style="font-size:12px;">—</span>
		</div>
		<div class="pcdn-item">
			<span class="pcdn-label">日志等级</span>
			<span id="pcdn-level" class="pcdn-value">—</span>
		</div>
		<div class="pcdn-item">
			<span class="pcdn-label">HTTP API</span>
			<span id="pcdn-http-state" class="pcdn-value pcdn-muted">—</span>
			<span id="pcdn-http-listen" class="pcdn-value pcdn-muted" style="font-size:12px;">—</span>
			<span id="pcdn-http-token" class="pcdn-value pcdn-muted" style="font-size:12px;">—</span>
		</div>
		<div class="pcdn-item">
			<span class="pcdn-label">配置文件</span>
			<span id="pcdn-cfg" class="pcdn-value" style="font-size:12px;">—</span>
		</div>
	</div>

	<div class="pcdn-actions">
		<button type="button" class="cbi-button cbi-button-apply" id="pcdn-btn-start">启动</button>
		<button type="button" class="cbi-button cbi-button-reset" id="pcdn-btn-stop">停止</button>
		<button type="button" class="cbi-button cbi-button-action" id="pcdn-btn-restart">重启</button>
		<button type="button" class="cbi-button cbi-button-action" id="pcdn-btn-reload">热重载配置</button>
		<button type="button" class="cbi-button cbi-button-neutral" id="pcdn-btn-refresh">刷新</button>
		<button type="button" class="cbi-button cbi-button-neutral" id="pcdn-btn-httpcheck">检测 HTTP API</button>
		<button type="button" class="cbi-button cbi-button-neutral" id="pcdn-btn-httpkey">获取密钥</button>
		<button type="button" class="cbi-button cbi-button-neutral" id="pcdn-btn-httpcopy" disabled>复制密钥</button>
		<label class="pcdn-auto"><input type="checkbox" id="pcdn-auto" checked="checked" /> 自动刷新（5 秒）</label>
	</div>

	<p id="pcdn-warn" class="pcdn-msg"></p>
	<p id="pcdn-hint" class="pcdn-msg"></p>
	<p id="pcdn-http-msg" class="pcdn-msg"></p>
</fieldset>

<fieldset class="cbi-section">
	<legend>实时统计（来自本机 HTTP API）</legend>
	<div id="pcdn-stats">
		<em class="pcdn-muted">读取中…</em>
	</div>
	<div id="pcdn-device"></div>
</fieldset>

<script type="text/javascript">//<![CDATA[
(function() {
	var U = {
		status: '<%=url("admin", "services", "pcdn-detector", "status")%>',
		svc: '<%=url("admin", "services", "pcdn-detector", "svc")%>',
		stats: '<%=url("admin", "services", "pcdn-detector", "stats")%>',
		device: '<%=url("admin", "services", "pcdn-detector", "device")%>',
		peers: '<%=url("admin", "services", "pcdn-detector", "peers")%>',
		httpinfo: '<%=url("admin", "services", "pcdn-detector", "httpinfo")%>',
		httpcheck: '<%=url("admin", "services", "pcdn-detector", "httpcheck")%>',
		config: '<%=url("admin", "services", "pcdn-detector", "config")%>',
		log: '<%=url("admin", "services", "pcdn-detector", "log")%>',
		update: '<%=url("admin", "services", "pcdn-detector", "update")%>'
	};

	var httpEnabled = false;
	var httpToken = '';

	// 直连后端：开启后实时统计 / 端口明细由浏览器直接请求 pcdn-detect 的 HTTP API，
	// 不再每次轮询都启动一个 Lua 代理进程；失败（跨域被拦 / 网络不通）自动回退。
	var direct = {
		enabled: false,
		base: '',
		token: '',
		reason: '',
		failedAt: 0
	};

	// 自动刷新：页面不可见或开关关闭时不轮询，避免后台空转
	var autoTimer = null;
	var autoEnabled = true;
	var refreshing = false;
	var inflightTimer = null;

	// 端口明细 / 对端 IP 均按需读取，不随汇总接口全量下发
	var detail = null;    // { mac, family, state, limit, page }
	var peerView = null;  // { mac, port, proto, v6, page, limit }

	// 兼容不同 LuCI：部分固件的 XHR 没有 post 方法
	function xhrPost(url, data, cb) {
		if (window.XHR && typeof XHR.post === 'function') {
			return XHR.post(url, data, cb);
		}

		if (window.LuCI && LuCI.prototype && typeof LuCI.prototype.post === 'function') {
			return LuCI.prototype.post.call(LuCI.prototype, url, data, cb);
		}

		if (window.LuCI && typeof LuCI.post === 'function') {
			return LuCI.post(url, data, cb);
		}

		var token = '';
		try {
			token = (window.LuCI && LuCI.env && LuCI.env.token) || '';
		} catch (e) {}
		if (!token) {
			try {
				token = (window.XHR && XHR.token) || '';
			} catch (e) {}
		}

		var body = [];
		for (var k in data) {
			if (Object.prototype.hasOwnProperty.call(data, k)) {
				body.push(encodeURIComponent(k) + '=' + encodeURIComponent(data[k] == null ? '' : data[k]));
			}
		}
		if (token) {
			body.push('token=' + encodeURIComponent(token));
		}

		var xhr = new XMLHttpRequest();
		xhr.open('POST', url, true);
		xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
		xhr.onreadystatechange = function() {
			if (xhr.readyState !== 4) return;
			var json = null;
			try { json = JSON.parse(xhr.responseText); } catch (e) {}
			cb(xhr, json, 0);
		};
		xhr.send(body.join('&'));
	}

	function $(id) { return document.getElementById(id); }

	function setText(id, v) {
		var el = $(id);
		if (el) el.textContent = (v === null || v === undefined || v === '') ? '—' : v;
	}

	function setHttpState(text, cls) {
		var el = $('pcdn-http-state');
		if (!el) return;
		el.textContent = text;
		el.className = 'pcdn-value ' + (cls || 'pcdn-muted');
	}

	function esc(s) {
		return String(s === null || s === undefined ? '' : s)
			.replace(/&/g, '&amp;').replace(/</g, '&lt;')
			.replace(/>/g, '&gt;').replace(/"/g, '&quot;');
	}

	function fmtBytes(n) {
		n = Number(n || 0);
		var units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
		var i = 0;
		while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
		return (i === 0 ? Math.floor(n) : n.toFixed(1)) + ' ' + units[i];
	}

	function opt(value, label, current) {
		return '<option value="' + esc(value) + '"'
			+ (String(current) === String(value) ? ' selected' : '') + '>'
			+ esc(label) + '</option>';
	}

	// 地址族汇总：端口条目数、其中封禁数，并按 udp / tcp 拆分
	// （上游 /api/v1/devices 与 /api/v1/device 使用同一口径）
	function familyText(f) {
		f = f || {};
		var ports = Number(f.ports || 0);
		var banned = Number(f.banned || 0);
		var udp = f.udp || {};
		var tcp = f.tcp || {};
		return ports + ' 端口' + (banned > 0 ? ('（封禁 ' + banned + '）') : '')
			+ ' · UDP ' + Number(udp.ports || 0) + '/' + Number(udp.banned || 0)
			+ ' · TCP ' + Number(tcp.ports || 0) + '/' + Number(tcp.banned || 0);
	}

	function showMsg(id, text, good) {
		var el = $(id);
		if (!el) return;
		el.textContent = text || '';
		el.className = 'pcdn-msg ' + (good ? 'pcdn-msg-ok' : 'pcdn-msg-bad');
		if (!text) el.className = 'pcdn-msg';
	}

	function refresh(done) {
		// 同一时刻只允许一个轮询在途：慢请求不会叠加成多个 CGI 进程
		if (refreshing) {
			if (done) done();
			return;
		}
		refreshing = true;

		var settled = false;
		function finish() {
			if (settled) return;
			settled = true;
			if (inflightTimer) {
				clearTimeout(inflightTimer);
				inflightTimer = null;
			}
			refreshing = false;
			if (done) done();
		}

		// 兜底：请求卡住时 15 秒后解除在途标记，避免自动刷新永久停摆
		inflightTimer = setTimeout(finish, 15000);

		XHR.get(U.status, null, function(x, d) {
			if (!d || !d.ok) {
				setText('pcdn-run', '状态获取失败');
				$('pcdn-run').className = 'pcdn-value pcdn-bad';
				finish();
				return;
			}

			var run = $('pcdn-run');
			run.textContent = d.running ? '运行中' : '已停止';
			run.className = 'pcdn-value ' + (d.running ? 'pcdn-ok' : 'pcdn-bad');

			setText('pcdn-version', d.version_base || d.version || '未知');
			setText('pcdn-version-build', d.version_build ? ('构建 ' + d.version_build) : '');
			$('pcdn-version').title = d.version || '';
			setText('pcdn-pid', d.pid || '—');
			setText('pcdn-uptime', d.uptime_text || '—');
			setText('pcdn-iface', d.interface || '未配置');
			setText('pcdn-proto', d.protocol ? ('协议：' + d.protocol) : '');
			setText('pcdn-level', d.log_level || '默认（warn）');

			httpEnabled = !!d.http_enabled;
			var httpText = d.http_listen || '—';
			if (d.http_port) httpText = '端口 ' + d.http_port + ' · ' + httpText;
			setText('pcdn-http-listen', httpText);
			$('pcdn-http-listen').title = d.http_url || '';
			setText('pcdn-http-token', d.http_token_set ? '密钥：已设置' : '密钥：未设置');
			$('pcdn-btn-httpkey').disabled = false;
			if (!httpEnabled) {
				httpToken = '';
				$('pcdn-btn-httpcopy').disabled = true;
				setHttpState('未启用', 'pcdn-muted');
			} else {
				setHttpState('已启用', 'pcdn-muted');
			}

			setText('pcdn-cfg', d.config_path || '—');
			$('pcdn-cfg').title = d.config_path || '';

			$('pcdn-btn-start').disabled = !!d.running;
			$('pcdn-btn-stop').disabled = !d.running;
			$('pcdn-btn-restart').disabled = !d.running;
			$('pcdn-btn-reload').disabled = !d.running;

			if (!d.bin_exists) {
				showMsg('pcdn-warn', '未找到程序文件：' + (d.bin_path || '') + '，请先到「下载/更新」中安装。', false);
			} else if (!d.config_exists) {
				showMsg('pcdn-warn', '配置文件不存在：' + (d.config_path || '') + '，打开配置页或启动服务会自动创建。', false);
			} else {
				showMsg('pcdn-warn', '', true);
			}

			configureDirect(d);

			// 服务未运行 / 未安装 / HTTP 服务器未开启时不再请求统计接口，
			// 避免每次轮询都白起一个 Lua 进程，或去连一个必然失败的端口
			if (!d.running || !d.bin_exists) {
				setHttpState(d.bin_exists ? '未运行' : '未安装', 'pcdn-muted');
				showStatsIdle(d.bin_exists
					? 'pcdn-detect 未运行，已暂停读取实时统计；启动后自动恢复。'
					: '未安装 pcdn-detect，请先到「下载/更新」安装。');
				if (detail) closeDetail();
				finish();
				return;
			}

			if (!d.http_enabled) {
				setHttpState('未启用', 'pcdn-muted');
				showStatsDisabled();
				if (detail) closeDetail();
				finish();
				return;
			}

			refreshStats(finish);
		});
	}

	function showStatsIdle(text) {
		var box = $('pcdn-stats');
		if (!box) return;
		box.innerHTML = '<p class="pcdn-muted" style="margin:0;">' + esc(text) + '</p>';
	}

	function showStatsDisabled() {
		var box = $('pcdn-stats');
		if (!box) return;
		box.innerHTML = '<p class="pcdn-muted" style="margin:0;">'
			+ 'HTTP API 未启用 <a href="' + U.config + '">前往配置</a></p>';
	}

	// 依据 /status 的返回决定是否直连：开关开启、地址可用、且不在失败冷却期内
	function configureDirect(d) {
		var base = '';

		// HTTP API 没开启时直连没有意义
		if (!d.direct_api || !d.http_enabled) {
			direct.enabled = false;
			direct.reason = '';
			return;
		}

		// 失败后 60 秒内不再尝试，避免 5 秒轮询反复触发跨域预检
		if (direct.failedAt && Date.now() - direct.failedAt < 60000) {
			direct.enabled = false;
			return;
		}

		if (d.direct_url) {
			base = d.direct_url;
		} else if (d.direct_url === '' && d.http_port) {
			// listen 绑在 0.0.0.0 / ::：用当前访问 LuCI 的主机名 + 监听端口
			base = 'http://' + location.hostname + ':' + d.http_port;
		}

		if (!base) {
			direct.enabled = false;
			direct.reason = d.direct_hint || '直连地址不可用';
			return;
		}

		direct.enabled = true;
		direct.base = String(base).replace(/\/+$/, '');
		direct.token = d.http_token || '';
		direct.failedAt = 0;
		direct.reason = '';
	}

	// 直连请求：只有浏览器层面失败（CORS / 网络 / 超时）才回退，
	// 4xx 等业务错误照常交给调用方展示。
	function directGet(path, params, cb) {
		var url = direct.base + path;
		var qs = [];
		var k;

		for (k in (params || {})) {
			if (Object.prototype.hasOwnProperty.call(params, k)) {
				qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]));
			}
		}

		if (direct.token) headers['Authorization'] = 'Bearer ' + direct.token;

		function fail() {
			direct.enabled = false;
			direct.failedAt = Date.now();
			direct.reason = '直连后端失败（CORS 未放行或网络不通），已回退到 LuCI 代理；'
				+ '请确认 [http] cors_allowed_origins 包含 ' + location.origin;
			cb('direct');
		}

		var opts = {
			method: 'GET',
			headers: headers,
			cache: 'no-store',
			credentials: 'omit'
		};

		var timer = null;
		var ctrl = null;
		if (typeof AbortController !== 'undefined') {
			ctrl = new AbortController();
			opts.signal = ctrl.signal;
			timer = setTimeout(function() { ctrl.abort(); }, 5000);
		}

		try {
			fetch(url, opts).then(function(r) {
				return r.text();
			}).then(function(text) {
				if (timer) clearTimeout(timer);
				var json = null;
				try { json = JSON.parse(text); } catch (e) {}
				cb(null, json);
			}).catch(function() {
				if (timer) clearTimeout(timer);
				fail();

	function refreshStats(done) {
		var box = $('pcdn-stats');
		if (!box) {
			if (done) done();
			return;
		}

		if (!httpEnabled) {
			setHttpState('未启用', 'pcdn-muted');
			showStatsDisabled();
			if (detail) closeDetail();
			if (done) done();
			return;
		}

		if (!direct.enabled) {
			statsViaProxy(box, done);
			return;
		}

		// 直连与代理保持一致：仍然是 status + devices 两段数据
		directGet('/api/v1/status', null, function(err, s) {
			if (err) {
				statsViaProxy(box, done);
				return;
			}

			directGet('/api/v1/devices', null, function(err2, dv) {
				if (err2) {
					statsViaProxy(box, done);
					return;
				}

				setHttpState('正常（直连）', 'pcdn-ok');
				$('pcdn-http-state').title = direct.base;
				renderStats(box, s || {}, dv || {}, null);
				if (done) done();
			});
		});
	}

	function statsViaProxy(box, done) {
		XHR.get(U.stats, null, function(x, d) {
			if (!d || !d.available) {
				setHttpState(direct.reason ? '代理' : '异常', direct.reason ? 'pcdn-muted' : 'pcdn-bad');
				box.innerHTML = '<p class="pcdn-muted" style="margin:0;">'
					+ esc((d && d.message) || '无法读取实时统计')
					+ (direct.reason ? '<br>直连不可用：' + esc(direct.reason) : '')
					+ ' <a href="' + U.config + '">前往配置</a></p>';
				if (done) done();
				return;
			}

			setHttpState(direct.reason ? '正常（代理）' : '正常', 'pcdn-ok');
			renderStats(box, d.status || {}, d.devices || {}, d.devices_error || null);
			if (done) done();

	function renderStats(box, s, dv, devicesError) {
		var devs = dv.devices || [];

		var html = '<div class="pcdn-stats-cards">';
		html += '<div class="pcdn-stat"><b>' + esc(s.tracked_devices || 0) + '</b><span>跟踪设备</span></div>';
		html += '<div class="pcdn-stat"><b>' + esc(s.alerts || 0) + '</b><span>累计告警</span></div>';
		html += '<div class="pcdn-stat"><b>' + esc(s.active_bans || 0) + '</b><span>当前封禁</span></div>';
		html += '<div class="pcdn-stat"><b>' + esc(s.full_banned || 0) + '</b><span>全端口封禁</span></div>';
		html += '<div class="pcdn-stat"><b>' + esc(s.upnp_blocked || 0) + '</b><span>UPnP 拦截</span></div>';
		html += '</div>';

		// 上游 /api/v1/devices 只返回设备级汇总；端口明细按需调用 /api/v1/device
		var evictions = Number(dv.port_evictions || 0);
		var drops = Number(dv.port_drops || 0);
		if (evictions > 0 || drops > 0) {
			html += '<p class="pcdn-muted" style="margin:0 0 8px;">'
				+ '[memory] max_ports 已生效：提前过期端口 ' + evictions + ' 次，丢弃新端口报文 ' + drops + ' 次。</p>';
		}

		var rows = [];
		for (var i = 0; i < devs.length; i++) {
			var mac = devs[i].mac || '';
			rows.push('<tr>'
				+ '<td>' + esc(mac) + '</td>'
				+ '<td>' + esc(familyText(devs[i].ipv4)) + '</td>'
				+ '<td>' + esc(familyText(devs[i].ipv6)) + '</td>'
				+ '<td><button type="button" class="cbi-button cbi-button-neutral pcdn-rowbtn" data-mac="'
					+ esc(mac) + '">端口明细</button></td>'

		if (!rows.length) {
			rows.push('<tr><td colspan="4" class="pcdn-empty">暂无设备统计（还没有流量，或监听网卡 / 名单配置不正确）</td></tr>');
		}

		html += '<table class="pcdn-table"><thead><tr>'
			+ '<th>设备 MAC</th><th>IPv4 端口 / 封禁</th><th>IPv6 端口 / 封禁</th><th>操作</th>'
			+ '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';

		if (devicesError) {
			html += '<p class="pcdn-muted" style="margin:6px 0 0;">' + esc(devicesError) + '</p>';
		}

		box.innerHTML = html;

		var btns = box.querySelectorAll('button[data-mac]');
		for (var k = 0; k < btns.length; k++) {
			btns[k].onclick = function() {
				openDetail(this.getAttribute('data-mac'));
			};
		}
	}

	function openDetail(mac) {
		detail = { mac: mac, family: 'all', state: 'all', limit: 100, page: 1 };

	function closeDetail() {
		detail = null;

	function bindDetailHead() {
		var close = $('pcdn-dev-close');

	// 连接失败则是本地返回的 {ok:false, message:"..."}。
	function apiError(d, fallback) {
		if (!d) return fallback;
		return d.error || d.message
			|| (d.http_status ? ('HTTP API 返回 ' + d.http_status) : fallback);

	function loadDetail() {

			+ esc(detail.mac) + ' 的端口明细…</p>';

		// 用 data 对象传参：部分 LuCI 的 XHR.get 会无条件在 URL 后追加 '?'，
		// 自己拼 query 会多出一个 '?' 并污染最后一个参数。
		var params = {
			mac: detail.mac,
			family: detail.family,
			state: detail.state,
			limit: detail.limit,
			page: detail.page
		};

		if (direct.enabled) {
			directGet('/api/v1/device', params, function(err, d) {
				if (!detail) return;
				if (err) {
					// directGet 已关闭直连，重走一次代理
					loadDetail();
					return;
				}
				handleDetail(d, box);
			});
			return;
		}

		XHR.get(U.device, params, function(x, d) {
			if (!detail) return;
			handleDetail(d, box);
		});

	function handleDetail(d, box) {

				+ '<div class="pcdn-detail-head"><h4>端口明细：' + esc(detail.mac) + '</h4>'
				+ '<span style="flex:1;"></span>'
				+ '<button type="button" class="cbi-button cbi-button-neutral pcdn-rowbtn" id="pcdn-dev-close">关闭</button>'
				+ '</div>'
				+ '<p class="pcdn-msg pcdn-msg-bad" style="display:block;">'
				+ esc(apiError(d, '无法读取端口明细')) + '</p>'
				+ '</div>';

			return;
		}

	function loadPeers() {
		var box = $('pcdn-peer-box');
		if (!box || !peerView) return;

			mac: peerView.mac,
			port: peerView.port,
			proto: peerView.proto,
			v6: peerView.v6 ? 'true' : 'false',
			page: peerView.page
		};
		if (peerView.limit) {
			query.limit = peerView.limit;
		}

		if (direct.enabled) {
			directGet('/api/v1/peers', query, function(err, d) {
				if (!peerView) return;
				if (err) {
					// directGet 已关闭直连，重走一次代理
					loadPeers();
					return;
				}
				handlePeers(d, box);
			});
			return;
		}

		XHR.get(U.peers, query, function(x, d) {
			if (!peerView) return;
			handlePeers(d, box);
		});

	function handlePeers(d, box) {
		if (!d || d.error || d.ok === false) {
			box.innerHTML = '<div class="pcdn-peers">'
				+ '<p class="pcdn-msg pcdn-msg-bad" style="display:block;">'
				+ esc(apiError(d, '无法读取对端 IP')) + '</p>'
				+ '<button type="button" class="cbi-button cbi-button-neutral pcdn-rowbtn" id="pcdn-peer-close">关闭</button>'
				+ '</div>';
			var cb = $('pcdn-peer-close');
			if (cb) cb.onclick = function() {

				var b = $('pcdn-peer-box');
				if (b) b.innerHTML = '';

		}

		renderPeers(d);
	}

	function renderPeers(v) {

		var box = $('pcdn-peer-box');
		if (!box || !peerView) return;

		var ips = v.peer_ips || [];
		var count = Number(v.peer_count || 0);
		var limit = Number(v.limit || peerView.limit || ips.length || 50);
		var page = Number(v.page || peerView.page || 1);
		var pages = Math.max(1, Math.ceil(count / limit));

		peerView.page = page;
		peerView.limit = limit;

		var html = '<div class="pcdn-peers">'
			+ '<div class="pcdn-detail-head">'
			+ '<h4 style="font-size:13px;">端口 ' + esc(v.port) + ' / ' + esc(v.proto) + '（'
			+ (v.v6 ? 'IPv6' : 'IPv4') + '）的对端 IP</h4>'
			+ '<span style="flex:1;"></span>'
			+ '<button type="button" class="cbi-button cbi-button-neutral pcdn-rowbtn" id="pcdn-peer-close">关闭</button>'
			+ '</div>'
			+ '<p class="pcdn-muted" style="margin:0 0 6px;">共 ' + count
			+ ' 个对端，单页最多 ' + limit + ' 个</p>'
			+ '<div class="pcdn-peers-list">'
			+ (ips.length ? ips.map(esc).join('<br>') : '<span class="pcdn-muted">本页没有对端 IP</span>')
			+ '</div>'
			+ '<div class="pcdn-pager">'
			+ '<button type="button" class="cbi-button cbi-button-neutral pcdn-rowbtn" id="pcdn-peer-prev"'
				+ (page <= 1 ? ' disabled' : '') + '>上一页</button>'
			+ '<span>第 ' + page + ' / ' + pages + ' 页</span>'
			+ '<button type="button" class="cbi-button cbi-button-neutral pcdn-rowbtn" id="pcdn-peer-next"'
				+ (v.truncated ? '' : ' disabled') + '>下一页</button>'
			+ '</div>'
			+ '</div>';

		box.innerHTML = html;

		var close = $('pcdn-peer-close');
		if (close) close.onclick = function() {
			peerView = null;
			box.innerHTML = '';
		};

		var prev = $('pcdn-peer-prev');
		if (prev) prev.onclick = function() {
			if (peerView.page <= 1) return;
			peerView.page--;
			loadPeers();
		};

		var next = $('pcdn-peer-next');
		if (next) next.onclick = function() {
			peerView.page++;
			loadPeers();
		};
	}

	function httpCheck() {
		showMsg('pcdn-http-msg', '正在检测 HTTP API…', true);

		XHR.get(U.httpcheck, null, function(x, d) {
			if (!d) {
				showMsg('pcdn-http-msg', '请求失败，请检查登录状态或页面超时', false);
				return;
			}

			var msg = d.message || '';
			if (d.reachable && d.http_status) {
				msg += '（HTTP ' + d.http_status + '）';
				// 仅 /api/v1/status 这小段 JSON 在 Lua 侧解析，用于提示计数
				if (d.data && d.data.tracked_devices !== undefined) {
					msg += '\n跟踪设备：' + d.data.tracked_devices + '，告警：' + (d.data.alerts || 0);
				}
			}
			showMsg('pcdn-http-msg', msg, !!d.ok);
			httpEnabled = !!d.enabled;

			if (!d.enabled) {
				setHttpState('未启用', 'pcdn-muted');
			} else if (d.skipped) {
				setHttpState('未运行', 'pcdn-muted');
			} else if (!d.reachable) {
				setHttpState('不可达', 'pcdn-bad');
			} else if (d.ok) {
				setHttpState('正常', 'pcdn-ok');
			} else {
				setHttpState('异常' + (d.http_status ? ' ' + d.http_status : ''), 'pcdn-bad');
			}

		});

	function getHttpKey() {
		XHR.get(U.httpinfo, null, function(x, d) {

				showMsg('pcdn-http-msg', '获取 HTTP 密钥失败', false);
				return;
			}

			httpToken = d.token || '';
			if (!d.token_set) {
				showMsg('pcdn-http-msg', '[http] token 未设置（为空）', false);
				$('pcdn-btn-httpcopy').disabled = true;
				return;
			}

			showMsg('pcdn-http-msg', 'HTTP 密钥：' + httpToken, true);
			$('pcdn-btn-httpcopy').disabled = false;
		});
	}

	function copyHttpKey() {
		if (!httpToken) return;

		function done(ok) {
			showMsg('pcdn-http-msg', ok ? '密钥已复制' : '复制失败，请手动选择文本', ok);
		}

		function fallback() {
			var ta = document.createElement('textarea');
			ta.value = httpToken;
			ta.style.position = 'fixed';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.select();
			var ok = false;
			try { ok = document.execCommand('copy'); } catch (e) {}
			document.body.removeChild(ta);
			done(ok);
		}

		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(httpToken).then(function() { done(true); }, fallback);
		} else {
			fallback();
		}
	}

	function svc(act) {
		if (act === 'stop' && !confirm('停止 pcdn-detect 会解除当前所有封禁，确定继续？')) {
			return;
		}

		showMsg('pcdn-hint', '正在执行：' + act + ' …', true);
		var btns = document.querySelectorAll('.pcdn-actions button');
		for (var i = 0; i < btns.length; i++) btns[i].disabled = true;

		xhrPost(U.svc, { action: act }, function(x, d) {
			if (d && d.ok) {
				showMsg('pcdn-hint', d.message || '操作完成', true);
			} else {
				showMsg('pcdn-hint', (d && d.message) || '操作失败', false);
			}
			setTimeout(refresh, 1200);
			setTimeout(function() {
				var btns2 = document.querySelectorAll('.pcdn-actions button');
				for (var k = 0; k < btns2.length; k++) btns2[k].disabled = false;
				refresh();
			}, 2500);
		});
	}

	function bind(id, act) {
		var el = $(id);
		if (el) el.onclick = function() { svc(act); };
	}

	bind('pcdn-btn-start', 'start');
	bind('pcdn-btn-stop', 'stop');
	bind('pcdn-btn-restart', 'restart');
	bind('pcdn-btn-reload', 'reload');
	$('pcdn-btn-refresh').onclick = function() { refresh(); };
	$('pcdn-btn-httpcheck').onclick = httpCheck;
	$('pcdn-btn-httpkey').onclick = getHttpKey;
	$('pcdn-btn-httpcopy').onclick = copyHttpKey;

	// 自动刷新：开关关闭或页面不可见时停掉定时器，避免后台反复拉起 Lua 进程
	function scheduleAuto() {
		if (autoTimer) {
			clearInterval(autoTimer);
			autoTimer = null;
		}
		if (!autoEnabled || document.hidden) return;

		autoTimer = setInterval(function() {
			if (document.hidden || !autoEnabled) return;
			refresh();
		}, 5000);
	}

	var autoBox = $('pcdn-auto');
	try {
		autoEnabled = window.localStorage.getItem('pcdn-auto-refresh') !== '0';
	} catch (e) {}
	if (autoBox) {
		autoBox.checked = autoEnabled;
		autoBox.onchange = function() {
			autoEnabled = !!this.checked;
			try {
				window.localStorage.setItem('pcdn-auto-refresh', autoEnabled ? '1' : '0');
			} catch (e) {}
			scheduleAuto();
			if (autoEnabled && !document.hidden) refresh();
		};
	}

	document.addEventListener('visibilitychange', function() {
		// 切回前台立即刷新一次并恢复定时器；切到后台则停掉
		if (!document.hidden && autoEnabled) refresh();
		scheduleAuto();
	});

	refresh();
	scheduleAuto();
})();
